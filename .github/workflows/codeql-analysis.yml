name: "CodeQL Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 15 * * 3'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    
    # I permessi devono essere dentro il job e scritti correttamente
    permissions:
      actions: read
      contents: read
      security-events: write 

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Inizializza CodeQL usando la v4 (standard del 2026)
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: php, javascript # Elenchiamo i linguaggi separati da virgola
        # Questo assicura che venga scaricato l'ultimo motore di analisi
        queries: security-extended,security-and-quality 

    # Per PHP non serve compilazione, ma Autobuild aiuta a configurare l'ambiente
    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4