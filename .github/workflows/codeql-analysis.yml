name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 15 * * 3'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    
    # I permessi devono stare DENTRO il job analyze
    permissions:
      actions: read
      contents: read
      security-events: write # Corretto: era scritto senza la 's' finale

    strategy:
      fail-fast: false
      matrix:
        # Abbiamo aggiunto 'php' e tolto 'python' che non ti serve per DVWA
        language: ['javascript', 'php']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4 # Versione aggiornata
      with:
        fetch-depth: 0 

    # Inizializza i motori di CodeQL
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3 # Versione v3 più stabile nel 2026
      with:
        languages: ${{ matrix.language }}

    # Tenta di compilare se necessario (per PHP e JS non fa quasi nulla, ma è bene tenerlo)
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    # Esegue l'analisi vera e propria
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3