name: Secret Scanning (Gitleaks)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 1. AGGIUNTO: Permessi necessari per la Tab Security e per leggere il codice
permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  gitleaks:
    name: Caccia ai Segreti
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        # Usiamo l'id per referenziarlo dopo se serve
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Usiamo il percorso assoluto della workspace per sicurezza
          report_format: sarif
          report_path: ${{ github.workspace }}/gitleaks.sarif

      - name: Carica i risultati nella Tab Security
        # Aggiornato a v4 come richiesto dal 2026
        uses: github/codeql-action/upload-sarif@v4 
        # Carica il file solo se esiste davvero
        if: always() 
        with:
          sarif_file: ${{ github.workspace }}/gitleaks.sarif