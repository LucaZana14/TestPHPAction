name: Secret Scanning (Gitleaks)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  gitleaks:
    name: Caccia ai Segreti
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        id: gitleaks_step # Diamo un ID per controllare l'esito dopo
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          report_format: sarif
          report_path: gitleaks.sarif
        continue-on-error: true # Fondamentale: non bloccare subito se trova leak

      - name: Check if SARIF exists
        id: check_file
        shell: bash
        # Questo comando controlla se il file esiste. Se non c'è, lo crea vuoto 
        # o lo segnala, così l'upload non fallisce male.
        run: |
          if [ -f "gitleaks.sarif" ]; then
            echo "file_exists=true" >> $GITHUB_OUTPUT
          else
            echo "file_exists=false" >> $GITHUB_OUTPUT
            echo "Gitleaks non ha prodotto un file SARIF (probabilmente 0 leak)."
          fi

      - name: Carica i risultati nella Tab Security
        if: steps.check_file.outputs.file_exists == 'true'
        uses: github/codeql-action/upload-sarif@v4 
        with:
          sarif_file: gitleaks.sarif