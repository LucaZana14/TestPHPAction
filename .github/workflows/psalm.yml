name: SAST - Psalm (PHP)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  security-events: write
  contents: read

jobs:
  psalm-analysis:
    name: Psalm Taint Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install Psalm
        # Risolviamo il conflitto tra il tuo Mac (8.4) e GitHub
        run: |
          # 1. Se manca il composer.json (progetto legacy), lo creiamo subito
          if [ ! -f composer.json ]; then
            echo '{"require-dev": {"vimeo/psalm": "^5.0"}}' > composer.json
          fi
          
          # 2. Eseguiamo un'UNICA installazione pulita
          # Il flag --ignore-platform-reqs è vitale per evitare l'errore sulla versione PHP
          composer install --ignore-platform-reqs --no-progress --no-interaction --no-scripts

      - name: Run Psalm
        # Eseguiamo l'analisi usando la baseline che hai generato sul Mac
        # continue-on-error permette di caricare i risultati anche se Psalm trova avvisi
        run: ./vendor/bin/psalm --report=results.sarif
        continue-on-error: true 

      - name: Upload Psalm SARIF
        uses: github/codeql-action/upload-sarif@v4
        # Carichiamo il file SARIF anche se lo step precedente ha fallito
        if: always()
        with:
          sarif_file: results.sarif