name: SCA & AI-BOM - Snyk (Dependencies)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  security-events: write
  contents: read

jobs:
  snyk-scan:
    name: Snyk Security & AI Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Fondamentale: Setup di PHP 8.4 per leggere il tuo composer.lock
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Setup Snyk
        uses: snyk/actions/setup@master

      # 2. Installazione delle dipendenze con il flag magico
      - name: Install dependencies
        run: |
          if [ ! -f composer.json ]; then
            echo '{"require": {}}' > composer.json
          fi
          # Usiamo lo stesso flag di Psalm per ignorare i blocchi di versione
          composer install --ignore-platform-reqs --no-scripts --no-interaction

      # 3. Scansione Snyk
      - name: Run Snyk Test
        shell: bash
        run: |
          # Aggiungiamo --all-projects per sicurezza
          snyk test --sarif-file-output=snyk.sarif || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk AI-BOM Test
        shell: bash
        run: |
            snyk aibom test || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Check if SARIF was created
        id: check_file
        run: |
          if [ -f snyk.sarif ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Snyk SARIF
        if: steps.check_file.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk.sarif