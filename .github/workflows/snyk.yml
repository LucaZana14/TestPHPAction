name: SCA - Snyk (Dependencies)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  security-events: write
  contents: read

jobs:
  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Snyk
        uses: snyk/actions/setup@master

      - name: Install dependencies
        # Snyk ha bisogno di analizzare le dipendenze installate
        run: |
          if [ ! -f composer.json ]; then
            echo '{"require": {}}' > composer.json
          fi
          composer install --no-scripts --no-interaction

      - name: Run Snyk Test
        shell: bash
        # Usiamo '|| true' per evitare che il job si fermi se trova vulnerabilità
        # Vogliamo che arrivi comunque allo step di upload
        run: |
          snyk test --sarif-file-output=snyk.sarif || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Check if SARIF was created
        id: check_file
        run: |
          if [ -f snyk.sarif ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Snyk non ha prodotto il file SARIF."
          fi

      - name: Upload Snyk SARIF
        if: steps.check_file.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk.sarif